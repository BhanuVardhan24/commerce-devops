name: Application CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-tests:
    name: Container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build application image
        run: docker build -t commerce-catalog:ci .

      - name: Run API tests inside the image
        run: |
          docker run --rm \
            --mount type=bind,src="${{ github.workspace }}/tests",dst=/srv/tests,readonly \
            commerce-catalog:ci \
            python -m unittest discover -s tests -v

      - name: Start application container
        run: |
          docker run -d \
            --name commerce-catalog \
            -p 127.0.0.1:8000:8000 \
            -e APP_VERSION="${{ github.sha }}" \
            commerce-catalog:ci

      - name: Run HTTP smoke tests
        run: python3 scripts/smoke_test.py

      - name: Show container logs
        if: always()
        run: docker logs commerce-catalog || true

      - name: Remove test container
        if: always()
        run: docker rm -f commerce-catalog || true

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -v