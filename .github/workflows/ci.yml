name: Application CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-tests:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -v

  container-tests:
    name: Container tests
    needs: application-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the application
        run: docker compose up --build --wait --wait-timeout 60

      - name: Run tests inside the application image
        run: |
          docker compose run --rm --no-deps \
            --volume "${{ github.workspace }}/tests:/srv/tests:ro" \
            web \
            python -m unittest discover -s tests -v

      - name: Run HTTP smoke tests
        run: python3 scripts/smoke_test.py

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove test services
        if: always()
        run: docker compose down --remove-orphans