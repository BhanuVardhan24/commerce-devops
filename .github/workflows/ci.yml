name: Application CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-tests:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API and storefront tests
        run: python -m unittest discover -s tests -v

  container-tests:
    name: Container tests
    needs: application-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_VERSION: ${{ github.sha }}
      COMMERCE_DB_PASSWORD: ci_only_not_a_real_secret
      WEBHOOK_SECRET: ci_only_webhook_fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the full application
        run: docker compose up --build --wait --wait-timeout 120
      - name: Test packaged application
        run: |
          docker compose run --rm --no-deps \
            --volume "${{ github.workspace }}/tests:/srv/tests:ro" \
            web python -m unittest discover -s tests -v
      - name: Check storefront and catalog
        run: python3 scripts/smoke_test.py
      - name: Verify checkout, decline, duplicates and retry
        run: python3 scripts/checkout_test.py
      - name: Verify mock payment and callback records
        run: |
          docker compose exec -T postgres psql -U commerce -d commerce -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF (SELECT count(*) FROM mock_payments) <> 3 OR (SELECT count(*) FROM webhook_events) <> 3 THEN RAISE EXCEPTION 'Expected three unique payments and callbacks'; END IF; END \$\$;"
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 150
      - name: Remove disposable test environment
        if: always()
        run: docker compose down --volumes --remove-orphans
