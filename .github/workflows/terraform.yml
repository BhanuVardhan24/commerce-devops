name: Terraform validation

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "ansible/terraform.yml"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "infra/**"
      - "ansible/terraform.yml"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_VERSION: "1.17.1"
      TF_IN_AUTOMATION: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install checksum-verified Terraform
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/commerce-terraform"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          curl --fail --show-error --location --output "terraform_${TF_VERSION}_linux_amd64.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl --fail --show-error --location --output SHA256SUMS \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          unzip -q "terraform_${TF_VERSION}_linux_amd64.zip" terraform
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize providers without accessing remote state
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=infra/bootstrap validate
