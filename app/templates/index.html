<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commerce Store</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#183149;margin:0}
    main{max-width:960px;margin:48px auto;padding:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
    article,section{background:white;border:1px solid #dce5ee;border-radius:16px;padding:24px;margin:20px 0}
    button,select{padding:12px;border-radius:8px;border:1px solid #00858d;margin:5px}
    button{background:#00858d;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
    pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{overflow-wrap:anywhere;color:#526579}
  </style>
</head>
<body><main>
  <p>COMMERCE STORE / SYNTHETIC DATA ONLY</p><h1>Everyday essentials.</h1>
  <div class="grid">
    {% for product in products %}
    <article><h2>{{ product.name }}</h2>
      <p>{{ product.currency }} {{ '%.2f'|format(product.price_minor / 100) }}</p>
      <button type="button" data-product="{{ product.id }}">Add to cart</button>
    </article>
    {% endfor %}
  </div>
  <section><h2>Your cart</h2><pre id="cart">Loading cart...</pre>
    <label>Mock payment outcome
      <select id="mode"><option value="success">Success</option>
        <option value="decline">Decline</option>
        <option value="timeout_once">Lost response, then safe retry</option></select>
    </label>
    <button id="checkout">Place order</button><button id="clear">New cart</button>
    <pre id="result" aria-live="polite">Ready.</pre>
  </section>
  <footer>Demo store. No real money. Release: {{ version }}</footer>
</main>
<script>

  function newUuid() {
  if (typeof globalThis.crypto.randomUUID === 'function') {
    return globalThis.crypto.randomUUID();
  }

  const bytes = new Uint8Array(16);
  globalThis.crypto.getRandomValues(bytes);

  // UUID version 4 and RFC variant bits.
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;

  const hex = Array.from(
    bytes,
    byte => byte.toString(16).padStart(2, '0')
  ).join('');

  return [
    hex.slice(0, 8),
    hex.slice(8, 12),
    hex.slice(12, 16),
    hex.slice(16, 20),
    hex.slice(20)
  ].join('-');
}
const stored = localStorage.getItem('commerce-cart');
let cartId = stored || newUuid();
localStorage.setItem('commerce-cart', cartId);
let items = [], checkoutKey = null, locked = false;
const cartView = document.getElementById('cart'), result = document.getElementById('result');
async function api(path, options = {}) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function json(method, body) {
  return {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
}
function showCart(){cartView.textContent = JSON.stringify(items, null, 2);}
document.querySelectorAll('[data-product]').forEach(button => button.onclick = async () => {
  if (locked) return;
  try {
    const product_id = Number(button.dataset.product);
    const next = items.map(i => ({...i})), existing = next.find(i => i.product_id === product_id);
    if (existing) existing.quantity++; else next.push({product_id, quantity:1});
    items = (await api('/api/carts/' + cartId, json('PUT', {items:next}))).items;
    checkoutKey = null; showCart();
  } catch(e){result.textContent=e.message;}
});
document.getElementById('checkout').onclick = async () => {
  if (locked) return;
  locked = true;
  const mode = document.getElementById('mode'); mode.disabled = true;
  document.getElementById('checkout').disabled = true;
checkoutKey ||= newUuid();
  try {
    const options = json('POST', {cart_id:cartId, mode:mode.value});
    options.headers['Idempotency-Key'] = checkoutKey;
    const order = await api('/api/orders', options);
    for(let n=0;n<45;n++) {
      const state = await api('/api/orders/' + order.order_id);
      result.textContent = JSON.stringify(state, null, 2);
      if(state.job_state === 'DONE' || state.job_state === 'DEAD') return;
      await new Promise(resolve => setTimeout(resolve,1000));
    }
    result.textContent += '\nStill processing. Keep this order ID for investigation.';
  } catch(e){result.textContent=e.message;}
  finally{locked=false; document.getElementById('checkout').disabled=false;}
};
document.getElementById('clear').onclick = () => {
  if(locked) return;
  localStorage.removeItem('commerce-cart'); location.reload();
};
api('/api/carts/' + cartId).then(data => {items=data.items;showCart();})
  .catch(e => {result.textContent=e.message;});
</script></body></html>
