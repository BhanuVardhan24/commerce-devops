image:
  repository: 036706657723.dkr.ecr.ap-south-1.amazonaws.com/commerce/catalog
  digest: sha256:8c64fbf94327aff442123815bcf1f4419e64283f43effd622196da13f271dc4c

redis:
  image: redis:7.4.12-alpine

payments:
  queueUrl: ""

ingress:
  enabled: false
  allowedCidrs: []

components:
  web:
    replicas: 1
    command:
      - gunicorn
      - --bind
      - "0.0.0.0:8000"
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - "app.main:create_app()"
    readinessPath: /readyz

  provider:
    replicas: 1
    command:
      - gunicorn
      - --bind
      - "0.0.0.0:8000"
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - "app.provider:create_app()"
    readinessPath: /healthz

  worker:
    replicas: 1
    command:
      - python
      - -m
      - app.sqs_payments
      - consume

  dispatcher:
    replicas: 1
    command:
      - python
      - -m
      - app.sqs_payments
      - dispatch