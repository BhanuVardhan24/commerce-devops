name: commerce-devops

services:
  web:
    build:
      context: .

    image: commerce-catalog:${APP_VERSION:-dev}

    environment:
      APP_VERSION: ${APP_VERSION:-compose-dev}

    ports:
      - "127.0.0.1:8000:8000"

    init: true

    mem_limit: 256m
    cpus: 1.0

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s